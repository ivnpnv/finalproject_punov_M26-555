[project]
name = "valutatrade-hub"
version = "0.1.0"
authors = [
    { name = "ivnpnv", email = "punov95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "D101", "D102", "D103"]
ignore = []

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
rates_ttl_seconds = 300
base_currency = "USD"
log_file = "logs/actions.log"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 3

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
